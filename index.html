<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة التطوير الذاتي الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0b1026;--c:#3a1c71;--ac:#ffb86b;--tx:#eef2f8;--mu:#a9b4c6;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--b),var(--c));background-attachment:fixed;overflow-x:hidden}
canvas#fx,#scene{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#scene{color:var(--ac);opacity:.16}
#scene svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:max(100%,900px);height:85%}
main{position:relative;max-width:1000px;margin:0 auto;padding:22px 18px 70px;min-height:100%}
h1,h2,h3{font-family:'Reem Kufi',sans-serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:10px}
.brand{color:var(--mu);font-size:.95rem}
.hero{text-align:center;padding:5vh 0 4vh}
.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.25}
.hero p{color:var(--mu);font-size:1.15rem;max-width:34rem;margin:14px auto 0;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:26px;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s;text-align:right}
.card:hover{transform:translateY(-8px);border-color:var(--ac);box-shadow:0 20px 40px rgba(0,0,0,.35)}
.card .ic{font-size:2.4rem}.card h3{font-size:1.5rem;margin:10px 0 6px}.card p{color:var(--mu);margin:0;line-height:1.8}
.panel{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:24px;margin-bottom:18px}
.page-t{font-size:clamp(1.8rem,5vw,2.8rem);margin:6px 0 4px}.page-s{color:var(--mu);margin:0 0 20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;color:var(--mu);font-size:.9rem;margin-bottom:6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.28);color:var(--tx);font:inherit}
select option{background:#151a2b}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 22px;background:var(--ac);color:#111;font-weight:600;transition:transform .2s,filter .2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button.ghost{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}
.stat{background:rgba(0,0,0,.25);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-family:'Reem Kufi';font-size:1.9rem;color:var(--ac)}.stat span{color:var(--mu);font-size:.85rem}
.tip{border-right:4px solid var(--ac);background:rgba(0,0,0,.25);border-radius:10px;padding:12px 16px;margin:10px 0;line-height:1.8}
ul{line-height:2;padding-right:20px}
.chat{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:85%;padding:11px 15px;border-radius:16px;line-height:1.8;white-space:pre-wrap}
.m.assistant{background:rgba(255,255,255,.1);align-self:flex-start;border-top-right-radius:4px}
.m.user{background:var(--ac);color:#111;align-self:flex-end;border-top-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{padding:8px 14px;font-size:.9rem}
.send{display:flex;gap:10px}.send input{flex:1}
footer{position:relative;text-align:center;color:var(--mu);font-size:.85rem;padding:0 0 24px}
#veil{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:all}
#veil div{font-family:'Reem Kufi';font-size:clamp(1.8rem,6vw,3.4rem);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.rv{opacity:0;animation:rv .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rv{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.rv{animation:none;opacity:1}}
</style></head><body>
<canvas id="fx"></canvas><div id="scene"></div>
<main><div id="app"></div></main>
<footer>حقوق التطوير محفوظة لـ عبد الله © 2026</footer>
<div id="veil"><div></div></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),veil=$('#veil');
const T={
home:{n:'الرئيسية',b:'#0b1026',c:'#3a1c71',a:'#ffb86b'},
fitness:{n:'التحدي الرياضي',b:'#1a0a0a',c:'#7a2418',a:'#ff7a59'},
study:{n:'التحدي الدراسي',b:'#061a2b',c:'#0f4c5c',a:'#5eead4'},
habits:{n:'تحدي العادات',b:'#140a2b',c:'#4a1d7a',a:'#c084fc'},
ai:{n:'المساعد الذكي',b:'#04121f',c:'#0a3b6b',a:'#38bdf8'}};
const S='<svg viewBox="0 0 1200 800" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">';
const SC={
home:S+'<circle cx="600" cy="420" r="150" fill="currentColor" fill-opacity=".3"/><path d="M0 800 250 520 400 640 640 330 860 600 980 480 1200 800Z"/><path d="M640 330V250l60 22-60 22M420 800l90-40 90-40 90-50 90-50"/></svg>',
fitness:S+'<rect x="380" y="380" width="440" height="40" rx="10"/><rect x="300" y="310" width="60" height="180" rx="14"/><rect x="230" y="340" width="50" height="120" rx="12"/><rect x="840" y="310" width="60" height="180" rx="14"/><rect x="920" y="340" width="50" height="120" rx="12"/><path d="M0 700c200-90 300 60 600-10s500 60 600-20"/></svg>',
study:S+'<path d="M600 300C480 250 340 260 240 300v300c100-40 240-50 360 0 120-50 260-40 360 0V300c-100-40-240-50-360 0ZM600 300v300"/><path d="M240 180l14 30 30 14-30 14-14 30-14-30-30-14 30-14zM960 140l10 22 22 10-22 10-10 22-10-22-22-10 22-10z"/></svg>',
habits:S+'<rect x="330" y="330" width="240" height="130" rx="65" transform="rotate(-20 450 395)"/><rect x="640" y="340" width="240" height="130" rx="65" transform="rotate(20 760 405)"/><path d="M600 300l-20 40 30 20-25 40M560 520l-40 60M660 520l50 55"/></svg>',
ai:S+'<path d="M200 500 420 330 640 470 860 300 1040 460M420 330 500 600 640 470 780 620 860 300M200 500 500 600"/><g fill="currentColor"><circle cx="200" cy="500" r="14"/><circle cx="420" cy="330" r="14"/><circle cx="640" cy="470" r="18"/><circle cx="860" cy="300" r="14"/><circle cx="1040" cy="460" r="14"/><circle cx="500" cy="600" r="14"/><circle cx="780" cy="620" r="14"/></g></svg>'};
let cur='home',busy=false;
function theme(p){const t=T[p],s=document.documentElement.style;s.setProperty('--b',t.b);s.setProperty('--c',t.c);s.setProperty('--ac',t.a);$('#scene').innerHTML=SC[p];document.title=p==='home'?'منصة التطوير الذاتي الشاملة':t.n+' | منصة التطوير الذاتي'}
// خلفية الجسيمات
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(70,innerWidth/14|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,v:.15+Math.random()*.4,r:1+Math.random()*2}))}
addEventListener('resize',sz);sz();
(function loop(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle=cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac');
P.forEach((p,i)=>{p.y-=p.v;if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width}
cx.globalAlpha=.45;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<110){cx.globalAlpha=.12*(1-d/110);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});
requestAnimationFrame(loop)})();
// الانتقال: دائرة تتوسع من مكان الضغط
async function go(p,e){if(busy||p===cur)return;busy=true;const t=T[p];
if(matchMedia('(prefers-reduced-motion:reduce)').matches||!veil.animate){cur=p;theme(p);render();busy=false;return}
const x=e&&e.clientX||innerWidth/2,y=e&&e.clientY||innerHeight/2;
veil.style.background=`radial-gradient(circle at 50% 60%,${t.c},${t.b})`;veil.firstChild.textContent=t.n;veil.firstChild.style.color=t.a;veil.style.display='flex';
const a=veil.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(150vmax at ${x}px ${y}px)`}],{duration:800,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
await a.finished;cur=p;theme(p);render();scrollTo(0,0);
const b=veil.animate([{opacity:1},{opacity:0}],{duration:600,delay:250,fill:'forwards'});await b.finished;
veil.style.display='none';a.cancel();b.cancel();busy=false}
const rv=i=>`class="rv" style="--i:${i}"`;
const back=()=>`<div class="top"><span class="brand">منصة التطوير الذاتي الشاملة</span><button class="ghost" id="bk">← الرئيسية</button></div>`;
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const tips=a=>a.map(t=>`<div class="tip">${t}</div>`).join('');
function render(){({home,fitness,study,habits,ai})[cur]();const b=$('#bk');if(b)b.onclick=e=>go('home',e)}
function home(){
const C=[['fitness','🏋️','التحدي الرياضي','احسب سعراتك وبروتينك وابنِ خطتك حسب هدفك.'],['study','📚','التحدي الدراسي','خطط ونصائح تخصصية ترفع مستواك الأكاديمي.'],['habits','🚫','تحدي العادات','استراتيجيات عملية لكسر العادات السلبية.'],['ai','🤖','المساعد الذكي','اسأله عن الدراسة والرياضة والعادات وسولف معه.']];
app.innerHTML=`<div class="hero"><h1 ${rv(0)}>منصة التطوير الذاتي الشاملة</h1><p ${rv(1)}>الدراسة والرياضة وتغيير العادات ومساعد ذكي، كلها في مكان واحد.</p></div>
<div class="grid">${C.map((c,i)=>`<div ${rv(i+2)}><div class="card" data-p="${c[0]}"><div class="ic">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p></div></div>`).join('')}</div>`;
app.querySelectorAll('.card').forEach(c=>c.onclick=e=>go(c.dataset.p,e))}
function fitness(){
const A={'خامل جداً':1.2,'تمارين خفيفة (1-2 يوم)':1.375,'نشاط متوسط (3-4 أيام)':1.55,'نشاط مكثف (5-6 أيام)':1.725,'محترف / بطل رياضي':1.9};
app.innerHTML=back()+`<h2 class="page-t rv">التحدي الرياضي</h2><p class="page-s rv" style="--i:1">أدخل بياناتك واحصل على تقدير احتياجك اليومي.</p>
<div class="panel rv" style="--i:2"><div class="row">
<div><label>الجنس</label><select id="g"><option>ذكر</option><option>أنثى</option></select></div>
<div><label>الوزن (كجم)</label><input id="w" type="number" value="75"></div>
<div><label>الطول (سم)</label><input id="h" type="number" value="175"></div>
<div><label>العمر</label><input id="a" type="number" value="22"></div>
<div><label>نشاطك الأسبوعي</label><select id="ac">${Object.keys(A).map(k=>`<option>${k}</option>`).join('')}</select></div>
<div><label>هدفك</label><select id="go"><option>تنشيف (خسارة دهون)</option><option>تضخيم (بناء عضل)</option><option>لياقة عامة</option></select></div></div>
<p><button id="calc">احسب التقرير</button></p><div id="out"></div></div>`;
$('#calc').onclick=()=>{const w=+$('#w').value,h=+$('#h').value,a=+$('#a').value;
if(!(w>0&&h>0&&a>0)){$('#out').innerHTML=tips(['أدخل أرقاماً صحيحة في كل الحقول.']);return}
const bmr=10*w+6.25*h-5*a+($('#g').value==='ذكر'?5:-161),td=bmr*A[$('#ac').value],g=$('#go').value,tg=g.startsWith('تنشيف')?td-500:g.startsWith('تضخيم')?td+400:td;
$('#out').innerHTML=`<div class="stats"><div class="stat"><b>${Math.round(td)}</b><span>سعرات المحافظة</span></div><div class="stat"><b>${Math.round(tg)}</b><span>هدفك اليومي</span></div><div class="stat"><b>${Math.round(w*1.8)}</b><span>بروتين (جم)</span></div><div class="stat"><b>${(w*.035).toFixed(1)}</b><span>ماء (لتر)</span></div></div>`+
tips(pick(['<b>قاعدة الـ 10%:</b> لا تزد شدة تمارينك أكثر من 10% أسبوعياً.','<b>الترطيب:</b> اشرب الماء قبل التمرين وأثناءه وبعده.','<b>الاستشفاء:</b> العضلات تنمو أثناء النوم، لا تقلل ساعاتك.','<b>البروتين:</b> وزّعه على وجباتك بدل وجبة واحدة.','<b>الراحة:</b> يوم راحة بين تمارين نفس العضلة.','<b>الإحماء:</b> 5-10 دقائق تقلل الإصابات.'],3))+'<p class="page-s">تقدير عام وليس بديلاً عن استشارة مختص.</p>'}}
const ST={'هندسة الشبكات':['تدرب على GNS3 و EVE-NG.','احصل على CCNA قبل التخرج.','افهم OSI Model جيداً.'],'الأمن السيبراني':['تعلم أساسيات Linux.','مارس تحديات CTF.','Security+ بداية ممتازة.'],'الذكاء الاصطناعي':['أتقن الرياضيات الأساسية.','تعلم Pandas و Scikit-learn.','ابنِ مشاريع ببيانات حقيقية.'],'علوم الحاسب':['ركز على هياكل البيانات.','حل مسائل برمجية يومياً.','افهم إدارة الذاكرة.'],'الطب':['استخدم Anki للتكرار المتباعد.','اربط المعلومة بالحالة السريرية.','راجع باستمرار.'],'الهندسة الميكانيكية':['أتقن برامج CAD.','افهم الديناميكا الحرارية.','تابع التصنيع الحديث.'],'إدارة الأعمال':['تعلم Excel و Power BI.','اقرأ في القيادة.','افهم التسويق الرقمي.'],'المحاسبة':['افهم IFRS.','تدرب على برامج المحاسبة.','ركز على دقة الأرقام.'],'القانون':['درب نفسك على الصياغة القانونية.','تابع الأحكام القضائية.','شارك في المحاكم الصورية.'],'التمريض':['اهتم بالجانب الإنساني.','أتقن مهارات الطوارئ.','تعلم قياس المؤشرات الحيوية.'],'الهندسة الكهربائية':['ركز على الطاقة والتحكم.','أتقن MATLAB.','افهم الدوائر والأنظمة المدمجة.']};
function study(){
app.innerHTML=back()+`<h2 class="page-t rv">التحدي الدراسي</h2><p class="page-s rv" style="--i:1">اختر تخصصك وخذ خطتك.</p>
<div class="panel rv" style="--i:2"><label>التخصص</label><select id="mj">${Object.keys(ST).map(k=>`<option>${k}</option>`).join('')}</select><div id="out"></div></div>`;
const show=()=>{const m=$('#mj').value;$('#out').innerHTML=`<h3 style="margin:18px 0 4px">خطة التميز في ${m}</h3><ul>${ST[m].map(t=>`<li>${t}</li>`).join('')}</ul><h3 style="margin:14px 0 4px">نصائح عامة</h3>`+tips(pick(['<b>البومودورو:</b> 25 دقيقة دراسة ثم استراحة.','<b>البيئة:</b> أبعد الجوال عنك وقت المذاكرة.','<b>الخرائط الذهنية:</b> حوّل المعلومات المعقدة لرسومات.','<b>فينمان:</b> اشرح ما درسته بكلماتك.'],2))};
$('#mj').onchange=show;show()}
function habits(){
app.innerHTML=back()+`<h2 class="page-t rv">مختبر العادات</h2><p class="page-s rv" style="--i:1">حدد العادة والمحفز وخذ خطة.</p>
<div class="panel rv" style="--i:2"><div class="row"><div><label>العادة التي تريد كسرها</label><input id="hb" placeholder="مثلاً: السهر"></div>
<div><label>صعوبتها عليك</label><select><option>سهلة</option><option>متوسطة</option><option>صعبة</option><option>إدمان</option></select></div>
<div><label>المحفز الرئيسي</label><select id="tr"><option>الملل</option><option>التوتر</option><option>أصدقاء السوء</option><option>الفراغ</option><option>الوقت (قبل النوم مثلاً)</option></select></div></div>
<p><button id="pl">ضع الخطة</button></p><div id="out"></div></div>`;
const TP={'الملل':'استبدل العادة بنشاط يشغل يديك وعقلك.','التوتر':'جرب التنفس العميق أو المشي 5 دقائق عند الرغبة.','أصدقاء السوء':'غيّر البيئة وقلل الاحتكاك بالمحفزات.','الفراغ':'اعمل جدولاً يومياً يملأ أوقات فراغك.','الوقت (قبل النوم مثلاً)':'غيّر روتين هذا الوقت بالكامل.'};
$('#pl').onclick=()=>{const h=$('#hb').value.trim()||'العادة';const e=document.createElement('span');e.textContent=h;
$('#out').innerHTML=`<h3>خطة التخلص من ${e.innerHTML}</h3>`+tips(['<b>للمحفز ('+$('#tr').value+'):</b> '+TP[$('#tr').value]].concat(pick(['<b>قاعدة الـ 5 ثوانٍ:</b> إذا جاتك الرغبة تحرك فوراً لشي ثاني.','<b>ربط العادات:</b> اربط عادة جيدة بروتين موجود عندك.','<b>التدرج:</b> خطوات صغيرة تقدر تستمر عليها.','<b>التدوين:</b> سجل متى ولماذا تظهر الرغبة.'],2)))}}
// المساعد
const SYS='أنت مساعد «منصة التطوير الذاتي الشاملة» من تطوير عبد الله. تكلم بلهجة سعودية بيضاء ودودة وبردود قصيرة ومفيدة (3-6 أسطر). أقسام المنصة: التحدي الرياضي (حساب السعرات والبروتين والماء)، تحدي العادات (خطة لكسر عادة حسب المحفز)، التحدي الدراسي (نصائح لـ 11 تخصصاً)، والمساعد الذكي (أنت). ساعد في اختيار التخصص والدراسة والرياضة والتغذية العامة وكسر العادات والتحفيز، ووجّه المستخدم للقسم المناسب ولا تخترع ميزات. لا تشخّص أمراضاً ولا تصف علاجات، وانصح بمراجعة مختص في الحالات الجادة.';
let msgs=[{role:'assistant',content:'يا هلا والله! أنا مساعدك في المنصة 👋 محتار بتخصص؟ تبي تنزل وزنك؟ تبي تكسر عادة؟ فضفض لي.'}],ask=false;
const LOC=[[['تخصص','محتار','دراس','مجال'],'الحيرة طبيعية! قلي وش تحب أكثر: التقنية، الطب، الأرقام، ولا التعامل مع الناس؟ وشوف نصايح كل تخصص في التحدي الدراسي.'],[['وزن','رجيم','سعرات','دهون','رياض'],'النزول الصحي يبي عجز سعرات بسيط وثبات. ادخل التحدي الرياضي واحسب احتياجك.'],[['عادة','سهر','تدخين','جوال'],'كسر العادة يبدأ بمعرفة المحفز. جرب مختبر العادات وحدد وش يشغلها.']];
const loc=q=>(LOC.find(l=>l[0].some(k=>q.includes(k)))||[0,'أقدر أساعدك في الدراسة والرياضة والعادات. وش تبي نبدأ فيه؟'])[1];
function ai(){
app.innerHTML=back()+`<h2 class="page-t rv">المساعد الذكي</h2><p class="page-s rv" style="--i:1">اسألني أي شي عن دراستك أو لياقتك أو عاداتك.</p>
<div class="panel rv" style="--i:2"><div class="chat" id="ch"></div><div class="chips" id="cp"></div>
<div class="send"><input id="q" placeholder="اكتب رسالتك..."><button id="sd">إرسال</button></div></div>`;
$('#cp').innerHTML=['محتار في التخصص','كيف أنزل وزني؟','أبغى أكسر عادة السهر','كيف أذاكر بشكل أفضل؟'].map(t=>`<button class="ghost">${t}</button>`).join('');
$('#cp').querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.textContent));
$('#sd').onclick=()=>send($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')send($('#q').value)};draw()}
function draw(){const ch=$('#ch');if(!ch)return;ch.innerHTML='';msgs.forEach(m=>{const d=document.createElement('div');d.className='m '+m.role;d.textContent=m.content;ch.appendChild(d)});ch.scrollTop=ch.scrollHeight}
async function send(q){q=(q||'').trim();if(!q||ask)return;ask=true;$('#q').value='';$('#cp').style.display='none';
msgs.push({role:'user',content:q});const bot={role:'assistant',content:'...'};msgs.push(bot);draw();
try{const use=window.claude&&window.claude.use,sm=use?await window.claude.use('sample'):null;
if(!sm)throw 0;
const hist=msgs.slice(0,-1).filter((m,i,a)=>!(m.role==='assistant'&&i===0)).slice(-10).map(m=>({role:m.role,content:m.content}));
hist[0].content=SYS+'\n\n'+hist[0].content;
const r=await sm(hist,{cache:false,onText:({text})=>{bot.content=text;draw()}});bot.content=r.text}
catch(e){bot.content=(e&&e.text)||loc(q)}
draw();ask=false}
theme('home');render();
</script></body></html>
