<script>
const $=s=>document.querySelector(s),app=$('#app'),veil=$('#veil');
const T={
home:{n:'الرئيسية',b:'#0b1026',c:'#3a1c71',a:'#ffb86b'},
fitness:{n:'التحدي الرياضي',b:'#1a0a0a',c:'#7a2418',a:'#ff7a59'},
study:{n:'التحدي الدراسي',b:'#061a2b',c:'#0f4c5c',a:'#5eead4'},
habits:{n:'تحدي العادات',b:'#140a2b',c:'#4a1d7a',a:'#c084fc'},
ai:{n:'المساعد الذكي',b:'#04121f',c:'#0a3b6b',a:'#38bdf8'}};
const S='<svg viewBox="0 0 1200 800" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">';
const SC={
home:S+'<circle cx="600" cy="420" r="150" fill="currentColor" fill-opacity=".3"/><path d="M0 800 250 520 400 640 640 330 860 600 980 480 1200 800Z"/><path d="M640 330V250l60 22-60 22M420 800l90-40 90-40 90-50 90-50"/></svg>',
fitness:S+'<rect x="380" y="380" width="440" height="40" rx="10"/><rect x="300" y="310" width="60" height="180" rx="14"/><rect x="230" y="340" width="50" height="120" rx="12"/><rect x="840" y="310" width="60" height="180" rx="14"/><rect x="920" y="340" width="50" height="120" rx="12"/><path d="M0 700c200-90 300 60 600-10s500 60 600-20"/></svg>',
study:S+'<path d="M600 300C480 250 340 260 240 300v300c100-40 240-50 360 0 120-50 260-40 360 0V300c-100-40-240-50-360 0ZM600 300v300"/><path d="M240 180l14 30 30 14-30 14-14 30-14-30-30-14 30-14zM960 140l10 22 22 10-22 10-10 22-10-22-22-10 22-10z"/></svg>',
habits:S+'<rect x="330" y="330" width="240" height="130" rx="65" transform="rotate(-20 450 395)"/><rect x="640" y="340" width="240" height="130" rx="65" transform="rotate(20 760 405)"/><path d="M600 300l-20 40 30 20-25 40M560 520l-40 60M660 520l50 55"/></svg>',
ai:S+'<path d="M200 500 420 330 640 470 860 300 1040 460M420 330 500 600 640 470 780 620 860 300M200 500 500 600"/><g fill="currentColor"><circle cx="200" cy="500" r="14"/><circle cx="420" cy="330" r="14"/><circle cx="640" cy="470" r="18"/><circle cx="860" cy="300" r="14"/><circle cx="1040" cy="460" r="14"/><circle cx="500" cy="600" r="14"/><circle cx="780" cy="620" r="14"/></g></svg>'};
let cur='home',busy=false;
function theme(p){const t=T[p],s=document.documentElement.style;s.setProperty('--b',t.b);s.setProperty('--c',t.c);s.setProperty('--ac',t.a);$('#scene').innerHTML=SC[p];document.title=p==='home'?'منصة التطوير الذاتي الشاملة':t.n+' | منصة التطوير الذاتي'}
// خلفية الجسيمات
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(70,innerWidth/14|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,v:.15+Math.random()*.4,r:1+Math.random()*2}))}
addEventListener('resize',sz);sz();
(function loop(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle=cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac');
P.forEach((p,i)=>{p.y-=p.v;if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width}
cx.globalAlpha=.45;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<110){cx.globalAlpha=.12*(1-d/110);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});
requestAnimationFrame(loop)})();
// الانتقال: دائرة تتوسع من مكان الضغط
async function go(p,e){if(busy||p===cur)return;busy=true;const t=T[p];
if(matchMedia('(prefers-reduced-motion:reduce)').matches||!veil.animate){cur=p;theme(p);render();busy=false;return}
const x=e&&e.clientX||innerWidth/2,y=e&&e.clientY||innerHeight/2;
veil.style.background=`radial-gradient(circle at 50% 60%,${t.c},${t.b})`;veil.firstChild.textContent=t.n;veil.firstChild.style.color=t.a;veil.style.display='flex';
const a=veil.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(150vmax at ${x}px ${y}px)`}],{duration:800,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
await a.finished;cur=p;theme(p);render();scrollTo(0,0);
const b=veil.animate([{opacity:1},{opacity:0}],{duration:600,delay:250,fill:'forwards'});await b.finished;
veil.style.display='none';a.cancel();b.cancel();busy=false}
const rv=i=>`class="rv" style="--i:${i}"`;
const back=()=>`<div class="top"><span class="brand">منصة التطوير الذاتي الشاملة</span><button class="ghost" id="bk">← الرئيسية</button></div>`;
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const tips=a=>a.map(t=>`<div class="tip">${t}</div>`).join('');
function render(){({home,fitness,study,habits,ai})[cur]();const b=$('#bk');if(b)b.onclick=e=>go('home',e)}
function home(){
const C=[['fitness','🏋️','التحدي الرياضي','احسب سعراتك وبروتينك وابنِ خطتك حسب هدفك.'],['study','📚','التحدي الدراسي','خطط ونصائح تخصصية ترفع مستواك الأكاديمي.'],['habits','🚫','تحدي العادات','استراتيجيات عملية لكسر العادات السلبية.'],['ai','🤖','المساعد الذكي','اسأله عن الدراسة والرياضة والعادات وسولف معه.']];
app.innerHTML=`<div class="hero"><h1 ${rv(0)}>منصة التطوير الذاتي الشاملة</h1><p ${rv(1)}>الدراسة والرياضة وتغيير العادات ومساعد ذكي، كلها في مكان واحد.</p></div>
<div class="grid">${C.map((c,i)=>`<div ${rv(i+2)}><div class="card" data-p="${c[0]}"><div class="ic">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p></div></div>`).join('')}</div>`;
app.querySelectorAll('.card').forEach(c=>c.onclick=e=>go(c.dataset.p,e))}
function fitness(){
const A={'خامل جداً':1.2,'تمارين خفيفة (1-2 يوم)':1.375,'نشاط متوسط (3-4 أيام)':1.55,'نشاط مكثف (5-6 أيام)':1.725,'محترف / بطل رياضي':1.9};
app.innerHTML=back()+`<h2 class="page-t rv">التحدي الرياضي</h2><p class="page-s rv" style="--i:1">أدخل بياناتك واحصل على تقدير احتياجك اليومي.</p>
<div class="panel rv" style="--i:2"><div class="row">
<div><label>الجنس</label><select id="g"><option>ذكر</option><option>أنثى</option></select></div>
<div><label>الوزن (كجم)</label><input id="w" type="number" value="75"></div>
<div><label>الطول (سم)</label><input id="h" type="number" value="175"></div>
<div><label>العمر</label><input id="a" type="number" value="22"></div>
<div><label>نشاطك الأسبوعي</label><select id="ac">${Object.keys(A).map(k=>`<option>${k}</option>`).join('')}</select></div>
<div><label>هدفك</label><select id="go"><option>تنشيف (خسارة دهون)</option><option>تضخيم (بناء عضل)</option><option>لياقة عامة</option></select></div></div>
<p><button id="calc">احسب التقرير</button></p><div id="out"></div></div>`;
$('#calc').onclick=()=>{const w=+$('#w').value,h=+$('#h').value,a=+$('#a').value;
if(!(w>0&&h>0&&a>0)){$('#out').innerHTML=tips(['أدخل أرقاماً صحيحة في كل الحقول.']);return}
const bmr=10*w+6.25*h-5*a+($('#g').value==='ذكر'?5:-161),td=bmr*A[$('#ac').value],g=$('#go').value,tg=g.startsWith('تنشيف')?td-500:g.startsWith('تضخيم')?td+400:td;
$('#out').innerHTML=`<div class="stats"><div class="stat"><b>${Math.round(td)}</b><span>سعرات المحافظة</span></div><div class="stat"><b>${Math.round(tg)}</b><span>هدفك اليومي</span></div><div class="stat"><b>${Math.round(w*1.8)}</b><span>بروتين (جم)</span></div><div class="stat"><b>${(w*.035).toFixed(1)}</b><span>ماء (لتر)</span></div></div>`+
tips(pick(['<b>قاعدة الـ 10%:</b> لا تزد شدة تمارينك أكثر من 10% أسبوعياً.','<b>الترطيب:</b> اشرب الماء قبل التمرين وأثناءه وبعده.','<b>الاستشفاء:</b> العضلات تنمو أثناء النوم، لا تقلل ساعاتك.','<b>البروتين:</b> وزّعه على وجباتك بدل وجبة واحدة.','<b>الراحة:</b> يوم راحة بين تمارين نفس العضلة.','<b>الإحماء:</b> 5-10 دقائق تقلل الإصابات.'],3))+'<p class="page-s">تقدير عام وليس بديلاً عن استشارة مختص.</p>'}}
const ST={'هندسة الشبكات':['تدرب على GNS3 و EVE-NG.','احصل على CCNA قبل التخرج.','افهم OSI Model جيداً.'],'الأمن السيبراني':['تعلم أساسيات Linux.','مارس تحديات CTF.','Security+ بداية ممتازة.'],'الذكاء الاصطناعي':['أتقن الرياضيات الأساسية.','تعلم Pandas و Scikit-learn.','ابنِ مشاريع ببيانات حقيقية.'],'علوم الحاسب':['ركز على هياكل البيانات.','حل مسائل برمجية يومياً.','افهم إدارة الذاكرة.'],'الطب':['استخدم Anki للتكرار المتباعد.','اربط المعلومة بالحالة السريرية.','راجع باستمرار.'],'الهندسة الميكانيكية':['أتقن برامج CAD.','افهم الديناميكا الحرارية.','تابع التصنيع الحديث.'],'إدارة الأعمال':['تعلم Excel و Power BI.','اقرأ في القيادة.','افهم التسويق الرقمي.'],'المحاسبة':['افهم IFRS.','تدرب على برامج المحاسبة.','ركز على دقة الأرقام.'],'القانون':['درب نفسك على الصياغة القانونية.','تابع الأحكام القضائية.','شارك في المحاكم الصورية.'],'التمريض':['اهتم بالجانب الإنساني.','أتقن مهارات الطوارئ.','تعلم قياس المؤشرات الحيوية.'],'الهندسة الكهربائية':['ركز على الطاقة والتحكم.','أتقن MATLAB.','افهم الدوائر والأنظمة المدمجة.']};
